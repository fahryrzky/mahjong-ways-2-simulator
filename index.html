<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Mahjong Ways 2</title>
  <!-- PeerJS WebRTC Library for live connection to backend/admin -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a0b10;
      --gold-primary: #f5b324;
      --gold-bright: #ffe58f;
      --gold-dark: #b87b08;
      --red-accent: #e63946;
      --win-color: #52c41a;
      --loss-color: #ff4d4f;
      --text-main: #f0f2f5;
      --text-muted: #8c93a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #06070a;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 0;
    }

    /* GAME VIEWPORT (MURNI PERSIS PG SOFT MAHJONG WAYS 2) */
    .game-viewport {
      width: 440px;
      max-width: 100vw;
      height: 100vh;
      max-height: 860px;
      background: radial-gradient(circle at 50% 15%, #351408 0%, #170906 60%, #0a0b12 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }

    @media (min-width: 450px) {
      .game-viewport {
        border-radius: 20px;
        border: 2px solid #6b4020;
        height: 94vh;
      }
    }

    /* Top Game Title Bar */
    .game-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: linear-gradient(180deg, #2b1107 0%, rgba(20,9,6,0.6) 100%);
      border-bottom: 1px solid #4a2814;
    }

    .game-logo {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffe58f;
      text-shadow: 0 0 8px rgba(245, 179, 36, 0.7);
    }

    .pg-badge {
      font-size: 10px;
      color: #a89279;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Free Spins Mode Banner */
    .mode-banner {
      background: linear-gradient(90deg, #780606 0%, #d42222 50%, #780606 100%);
      color: #fff;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 5px;
      display: none;
      box-shadow: 0 0 15px rgba(230, 57, 70, 0.8);
      border-bottom: 1px solid #ff7875;
    }

    .mode-banner.active {
      display: block;
      animation: bannerPulse 1s infinite alternate;
    }

    /* Multiplier Ladder (x1, x2, x3, x5 atau x2, x4, x6, x10) */
    .multiplier-bar {
      display: flex;
      justify-content: space-around;
      background: linear-gradient(90deg, #3d1b09 0%, #572910 50%, #3d1b09 100%);
      padding: 8px 12px;
      border-bottom: 2px solid #a36528;
      margin: 8px 10px 4px 10px;
      border-radius: 12px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.7);
    }

    .mult-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #bfa181;
      font-weight: 900;
      font-size: 14px;
      padding: 3px 12px;
      border-radius: 8px;
      transition: all 0.25s ease;
    }

    .mult-item.active {
      color: #fff;
      background: linear-gradient(180deg, #ffcc00 0%, #b87b08 100%);
      transform: scale(1.18);
      box-shadow: 0 0 16px #ffcc00;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Ways to win badge */
    .ways-badge-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 14px 4px 14px;
      font-size: 11px;
      color: #d1b18a;
      font-weight: 700;
    }

    /* 5-Reel Matrix: 4-5-5-5-4 (2,000 WAYS) */
    .reels-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      padding: 8px 10px;
      background: rgba(14, 7, 7, 0.92);
      margin: 0 10px;
      border-radius: 14px;
      border: 1px solid #5a381e;
      position: relative;
      flex: 1;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.95);
      align-content: center;
    }

    .reel-column {
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
    }

    .reel-column.col-edge {
      padding-top: 72px;
    }

    .tile-slot {
      height: 68px;
      background: linear-gradient(145deg, #fffdf8 0%, #e6d8ba 100%);
      border-radius: 8px;
      border: 2px solid #b89b72;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 2px #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.2s, filter 0.2s, opacity 0.2s;
      user-select: none;
    }

    .tile-slot.top-row {
      background: linear-gradient(145deg, #fff5d6 0%, #e8cf8d 100%);
      border-color: #d4a03e;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 0 6px rgba(245, 179, 36, 0.4);
    }

    .tile-slot.gold {
      border: 3px solid #ffcc00 !important;
      box-shadow: 0 0 14px rgba(255, 204, 0, 0.9), inset 0 0 10px rgba(255, 204, 0, 0.6) !important;
      animation: goldGlow 1.2s infinite alternate;
    }

    .tile-slot.gold::after {
      content: "GOLD";
      position: absolute;
      top: 2px;
      right: 3px;
      font-size: 7px;
      background: linear-gradient(180deg, #d48806, #874d00);
      color: #fff;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .tile-slot.wild {
      background: linear-gradient(145deg, #ffec3d 0%, #d48806 60%, #874d00 100%) !important;
      border: 2px solid #fff !important;
      color: #fff !important;
      box-shadow: 0 0 16px #faad14, inset 0 0 8px #fff !important;
    }

    .tile-slot.wild .tile-name {
      color: #fff !important;
      text-shadow: 0 1px 3px #000;
    }

    .tile-slot.scatter {
      background: linear-gradient(145deg, #ff4d4f 0%, #ad2102 70%, #5c0011 100%) !important;
      border: 2px solid #ffec3d !important;
      color: #fff !important;
      box-shadow: 0 0 16px rgba(255, 77, 79, 0.9), inset 0 0 6px #ffec3d !important;
      animation: scatterPulse 0.9s infinite alternate;
    }

    .tile-slot.scatter .tile-name {
      color: #ffec3d !important;
      text-shadow: 0 1px 3px #000;
    }

    .tile-slot.winning {
      animation: winFlash 0.3s infinite alternate;
      border-color: #52c41a !important;
      box-shadow: 0 0 18px #52c41a, inset 0 0 10px #73d13d !important;
      z-index: 10;
    }

    .tile-slot.exploding {
      transform: scale(0.2);
      opacity: 0;
      filter: brightness(2.5);
      transition: all 0.35s ease-out;
    }

    .tile-slot.transforming-wild {
      animation: wildTransformAnim 0.6s ease-in-out;
    }

    .tile-slot .tile-icon {
      font-size: 30px;
      line-height: 1;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
    }

    .tile-slot .tile-name {
      font-size: 8px;
      font-weight: 800;
      color: #2b2b2b;
      margin-top: 3px;
    }

    .celebration-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      padding: 20px;
      text-align: center;
    }

    .celebration-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .win-banner-title {
      font-size: 36px;
      font-weight: 900;
      color: #ffec3d;
      text-shadow: 0 0 20px #fa8c16, 0 0 10px #f5222d;
      margin-bottom: 8px;
      animation: bannerPulse 0.6s infinite alternate;
      letter-spacing: 2px;
    }

    .win-banner-amount {
      font-size: 30px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 20px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .game-hud {
      padding: 10px 14px;
      background: linear-gradient(180deg, #1f120c 0%, #0d0605 100%);
      border-top: 2px solid #5a381e;
      margin-top: auto;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      background: rgba(0,0,0,0.65);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid #3d2315;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .stat-val {
      font-size: 15px;
      font-weight: 900;
      color: var(--gold-bright);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .bet-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #251a14;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #4a2f1c;
    }

    .bet-btn {
      background: #472b17;
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spin-btn {
      flex: 1;
      height: 52px;
      background: linear-gradient(180deg, #52c41a 0%, #237804 100%);
      border: 2px solid #95de64;
      border-radius: 26px;
      color: white;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(82, 196, 26, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s;
    }

    .spin-btn:active {
      transform: scale(0.96);
    }

    .spin-btn:disabled {
      background: #3a3a3a;
      border-color: #666;
      cursor: not-allowed;
      box-shadow: none;
      color: #888;
    }

    .quick-toggles {
      display: flex;
      gap: 6px;
    }

    .toggle-btn {
      background: #251a14;
      border: 1px solid #5a381e;
      color: #aaa;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 700;
    }

    .toggle-btn.active {
      background: var(--gold-primary);
      color: #000;
      border-color: #ffe58f;
      font-weight: 900;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #52c41a;
      display: inline-block;
      margin-left: 6px;
      box-shadow: 0 0 5px #52c41a;
    }

    .status-dot.connecting {
      background: #faad14;
      box-shadow: 0 0 5px #faad14;
    }

    @keyframes goldGlow {
      0% { box-shadow: 0 0 6px rgba(255, 204, 0, 0.4); }
      100% { box-shadow: 0 0 16px rgba(255, 204, 0, 0.95); }
    }

    @keyframes scatterPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    @keyframes winFlash {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.06); filter: brightness(1.35); }
    }

    @keyframes bannerPulse {
      0% { transform: scale(0.97); }
      100% { transform: scale(1.03); }
    }

    @keyframes wildTransformAnim {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(90deg) scale(1.2); filter: brightness(3); }
      100% { transform: rotateY(0deg) scale(1); }
    }
  </style>
</head>
<body>

  <div class="game-viewport">
    
    <div class="game-top-bar">
      <div class="game-logo">
        MAHJONG WAYS 2
        <span class="status-dot" id="serverStatusDot" title="Server Status"></span>
      </div>
      <div class="pg-badge">POCKET GAMES SOFT</div>
    </div>

    <div class="mode-banner" id="freeSpinsBanner">
      🔥 PUTARAN GRATIS: SISA <span id="fsCount">10</span> PUTARAN 🔥
    </div>

    <div class="multiplier-bar" id="multiplierBar">
      <div class="mult-item active" id="mStep1"><span id="mText1">x1</span></div>
      <div class="mult-item" id="mStep2"><span id="mText2">x2</span></div>
      <div class="mult-item" id="mStep3"><span id="mText3">x3</span></div>
      <div class="mult-item" id="mStep4"><span id="mText4">x5</span></div>
    </div>

    <div class="ways-badge-bar">
      <span>2.000 CARA (WAYS)</span>
      <span id="cascadeStepText" style="color: var(--gold-primary);">Runtuhan: 0</span>
    </div>

    <div class="reels-board" id="reelsBoard"></div>

    <div class="game-hud">
      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-label">Saldo</span>
          <span class="stat-val" id="playerBalanceDisplay">Rp 100.000</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Taruhan</span>
          <span class="stat-val" id="currentBetDisplay">Rp 10.000</span>
        </div>
        <div class="stat-box" style="text-align: right;">
          <span class="stat-label">Menang</span>
          <span class="stat-val" style="color: #52c41a;" id="spinWinDisplay">Rp 0</span>
        </div>
      </div>

      <div class="controls-row">
        <div class="bet-selector">
          <button class="bet-btn" onclick="adjustBet(-2000)">-</button>
          <span style="font-size: 13px; font-weight: bold;" id="betValShort">10k</span>
          <button class="bet-btn" onclick="adjustBet(2000)">+</button>
        </div>

        <button class="spin-btn" id="spinButton" onclick="handleSpinClick()">
          <span>PUTAR</span> 🀄
        </button>

        <div class="quick-toggles">
          <button class="toggle-btn" id="turboToggle" onclick="toggleTurbo()">TURBO</button>
          <button class="toggle-btn" id="soundToggle" onclick="toggleSound()">🔊 ON</button>
        </div>
      </div>
    </div>

    <div class="celebration-overlay" id="celebrationOverlay">
      <div class="win-banner-title" id="celebTitle">SUPER WIN!</div>
      <div class="win-banner-amount" id="celebAmount">Rp 4.000</div>
      <button style="padding: 10px 28px; background: linear-gradient(180deg, #ffcc00, #b87b08); border: none; border-radius: 20px; color: #000; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,204,0,0.5);" onclick="closeCelebration()">
        LANJUT
      </button>
    </div>

  </div>

  <script>
    /* =========================================================
       AUDIO SYNTHESIS (Web Audio API)
       ========================================================= */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'spin') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.18);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'tile_stop') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'near_miss_heartbeat') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(55, now);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'cascade_win') {
        [440, 554, 659].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.18, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.2);
        });
      } else if (type === 'wild_transform') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win_cheer') {
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.12, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.07 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.3);
        });
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggle').innerText = soundEnabled ? '🔊 ON' : '🔇 OFF';
      document.getElementById('soundToggle').classList.toggle('active', soundEnabled);
    }

    /* =========================================================
       GAME STATE & PAYTABLE
       ========================================================= */
    const SYMBOLS = [
      { id: 'fa', name: 'Fa', icon: '🀅', pays: { 3: 10, 4: 25, 5: 50 }, canBeGold: true },
      { id: 'zhong', name: 'Zhong', icon: '🀄', pays: { 3: 8, 4: 20, 5: 40 }, canBeGold: true },
      { id: 'bai', name: 'Bai', icon: '🀆', pays: { 3: 6, 4: 15, 5: 30 }, canBeGold: true },
      { id: 'eight_dots', name: '8 Dots', icon: '🀙', pays: { 3: 4, 4: 10, 5: 15 }, canBeGold: true },
      { id: 'five_bamboo', name: '5 Bamboo', icon: '🀐', pays: { 3: 3, 4: 8, 5: 12 }, canBeGold: true },
      { id: 'character', name: '5 Wan', icon: '🀇', pays: { 3: 2, 4: 5, 5: 10 }, canBeGold: true },
      { id: 'two_dots', name: '2 Dots', icon: '🀘', pays: { 3: 1, 4: 3, 5: 6 }, canBeGold: true },
      { id: 'wild', name: 'WILD', icon: '👑', isWild: true, canBeGold: false },
      { id: 'scatter', name: 'SCATTER', icon: '📜', isScatter: true, canBeGold: false }
    ];

    const reelRows = [4, 5, 5, 5, 4];
    let gridMatrix = [];

    let playerBalance = 100000;
    let currentBet = 10000;
    let isSpinning = false;
    let turboMode = false;

    let cascadeIndex = 0;
    let isFreeSpinsMode = false;
    let freeSpinsRemaining = 0;

    const baseMultipliers = [1, 2, 3, 5];
    const freeSpinMultipliers = [2, 4, 6, 10];

    // Backend Connection State & Active Preset
    let peer = null;
    let adminConn = null;
    let pendingSpinResolve = null;
    let activePreset = 'zonk'; // Default preset: SELALU KALAH

    const urlParams = new URLSearchParams(window.location.search);
    const roomKey = urlParams.get('room') || 'bapa';

    function initReelsBoard() {
      gridMatrix = [];
      const board = document.getElementById('reelsBoard');
      board.innerHTML = '';

      for (let c = 0; c < 5; c++) {
        const colDiv = document.createElement('div');
        colDiv.className = `reel-column col-${c}`;
        if (c === 0 || c === 4) colDiv.classList.add('col-edge');
        colDiv.id = `col-${c}`;
        gridMatrix[c] = [];

        for (let r = 0; r < reelRows[c]; r++) {
          const slot = document.createElement('div');
          slot.className = 'tile-slot';
          if (r === 0 && (c === 1 || c === 2 || c === 3)) slot.classList.add('top-row');
          slot.id = `cell-${c}-${r}`;
          colDiv.appendChild(slot);

          // default initial visually appealing grid (guaranteed no win)
          const sym = getGuaranteedZonkTile(c, r);
          gridMatrix[c][r] = { ...sym, isGold: false };
          renderCell(c, r);
        }
        board.appendChild(colDiv);
      }
    }

    function renderCell(c, r) {
      const data = gridMatrix[c][r];
      const el = document.getElementById(`cell-${c}-${r}`);
      if (!el || !data) return;

      el.className = 'tile-slot';
      if (r === 0 && (c === 1 || c === 2 || c === 3)) el.classList.add('top-row');
      if (data.isGold) el.classList.add('gold');
      if (data.isWild) el.classList.add('wild');
      if (data.isScatter) el.classList.add('scatter');

      el.innerHTML = `
        <div class="tile-icon">${data.icon}</div>
        <div class="tile-name">${data.name}</div>
      `;
    }

    function getCurrentMultiplier() {
      const ladder = isFreeSpinsMode ? freeSpinMultipliers : baseMultipliers;
      const idx = Math.min(cascadeIndex, ladder.length - 1);
      return ladder[idx];
    }

    function updateMultiplierDisplay() {
      const ladder = isFreeSpinsMode ? freeSpinMultipliers : baseMultipliers;
      for (let i = 0; i < 4; i++) {
        const textEl = document.getElementById(`mText${i + 1}`);
        const stepEl = document.getElementById(`mStep${i + 1}`);
        textEl.innerText = `x${ladder[i]}`;
        stepEl.classList.toggle('active', i === Math.min(cascadeIndex, 3));
      }
    }

    function adjustBet(delta) {
      if (isSpinning) return;
      currentBet = Math.max(2000, Math.min(50000, currentBet + delta));
      document.getElementById('currentBetDisplay').innerText = `Rp ${currentBet.toLocaleString('id-ID')}`;
      document.getElementById('betValShort').innerText = `${currentBet / 1000}k`;
      notifyAdminState();
    }

    function toggleTurbo() {
      turboMode = !turboMode;
      document.getElementById('turboToggle').classList.toggle('active', turboMode);
    }

    /* =========================================================
       KOMUNIKASI KE BACKEND / ADMIN (PEERJS)
       ========================================================= */
    function initConnection() {
      const dot = document.getElementById('serverStatusDot');
      dot.className = 'status-dot connecting';

      const playerPeerId = `mw2-player-${roomKey}-${Math.floor(Math.random() * 10000)}`;
      peer = new Peer(playerPeerId);

      peer.on('open', () => {
        dot.className = 'status-dot';
        connectToAdmin();
      });

      peer.on('error', (err) => {
        dot.className = 'status-dot connecting';
        setTimeout(connectToAdmin, 2500);
      });
    }

    function connectToAdmin() {
      const adminPeerId = `mw2-admin-${roomKey}`;
      adminConn = peer.connect(adminPeerId, { reliable: true });

      adminConn.on('open', () => {
        document.getElementById('serverStatusDot').className = 'status-dot';
        notifyAdminState();
      });

      adminConn.on('data', (data) => {
        handleAdminMessage(data);
      });

      adminConn.on('close', () => {
        document.getElementById('serverStatusDot').className = 'status-dot connecting';
        setTimeout(connectToAdmin, 2500);
      });
    }

    function notifyAdminState() {
      if (adminConn && adminConn.open) {
        adminConn.send({
          type: 'PLAYER_STATE',
          balance: playerBalance,
          bet: currentBet,
          isFreeSpins: isFreeSpinsMode,
          freeSpinsLeft: freeSpinsRemaining
        });
      }
    }

    function handleAdminMessage(msg) {
      if (msg.type === 'SET_OUTCOME') {
        if (pendingSpinResolve) {
          pendingSpinResolve(msg.outcome);
          pendingSpinResolve = null;
        }
      } else if (msg.type === 'SYNC_PRESET') {
        // Update preset aktif dari admin secara real-time
        activePreset = msg.preset || 'zonk';
      }
    }

    /* =========================================================
       SPIN HANDLER & GUARANTEED OUTCOME DISPATCHER
       ========================================================= */
    async function handleSpinClick() {
      if (isSpinning) return;
      if (playerBalance < currentBet) {
        alert("Saldo tidak mencukupi untuk memasang taruhan.");
        return;
      }

      isSpinning = true;
      document.getElementById('spinButton').disabled = true;

      cascadeIndex = 0;
      updateMultiplierDisplay();
      document.getElementById('cascadeStepText').innerText = `Runtuhan: 0`;

      if (!isFreeSpinsMode) {
        playerBalance -= currentBet;
        updateBalanceUI(0);
      } else {
        freeSpinsRemaining--;
        document.getElementById('fsCount').innerText = freeSpinsRemaining;
      }

      playSound('spin');

      // Beri tahu backend/admin bahwa ayah memencet SPIN
      if (adminConn && adminConn.open) {
        adminConn.send({
          type: 'SPIN_REQUEST',
          bet: currentBet,
          balance: playerBalance
        });
      }

      const rollPromise = animateRollingReels();

      // Tunggu hasil dari backend (timeout 1.8s fallback ke activePreset yang pasti aman)
      const outcomePromise = new Promise((resolve) => {
        pendingSpinResolve = resolve;
        setTimeout(() => {
          if (pendingSpinResolve) {
            let fallbackOutcome = 'zonk';
            if (activePreset === 'ldw') fallbackOutcome = 'ldw';
            else if (activePreset === 'real_slot') {
              const r = Math.random();
              if (r < 0.6) fallbackOutcome = 'zonk';
              else if (r < 0.9) fallbackOutcome = 'ldw';
              else fallbackOutcome = 'win_hook';
            }
            pendingSpinResolve(fallbackOutcome);
            pendingSpinResolve = null;
          }
        }, 1800);
      });

      const [_, outcome] = await Promise.all([rollPromise, outcomePromise]);

      // Terapkan pola grid secara ketat sesuai outcome
      applyStrictGridOutcome(outcome);

      // Render grid awal
      for (let c = 0; c < 5; c++) {
        for (let r = 0; r < reelRows[c]; r++) {
          renderCell(c, r);
        }
      }

      // Jika Near Miss: 2 Scatter muncul, Reel 3 meleset, dijamin 0 payout
      if (outcome === 'near_miss') {
        playSound('near_miss_heartbeat');
        await new Promise(r => setTimeout(r, 700));
        isSpinning = false;
        document.getElementById('spinButton').disabled = false;
        notifyAdminState();
        return;
      }

      // Jalankan siklus Runtuhan (Cascading)
      let spinTotalWin = 0;
      let cascadeCount = 0;
      let hasWins = true;

      while (hasWins) {
        const evalResult = evaluateWaysWin();

        // Safety check untuk mode zonk: Jika outcome === 'zonk', paksa 0 kemenangan
        if (outcome === 'zonk' && evalResult.winningWays.length > 0) {
          hasWins = false;
          break;
        }

        if (evalResult.winningWays.length > 0) {
          cascadeCount++;
          cascadeIndex = Math.min(cascadeIndex + 1, 3);
          updateMultiplierDisplay();
          document.getElementById('cascadeStepText').innerText = `Runtuhan: ${cascadeCount}`;

          const mult = getCurrentMultiplier();
          const stepPayout = evalResult.totalBasePayout * (currentBet / 20) * mult;
          spinTotalWin += stepPayout;

          playSound('cascade_win');

          evalResult.winningCells.forEach(([c, r]) => {
            const el = document.getElementById(`cell-${c}-${r}`);
            if (el) el.classList.add('winning');
          });

          await new Promise(r => setTimeout(r, turboMode ? 300 : 550));

          let transformedWilds = 0;
          evalResult.winningCells.forEach(([c, r]) => {
            const cell = gridMatrix[c][r];
            const el = document.getElementById(`cell-${c}-${r}`);

            if (cell.isGold) {
              gridMatrix[c][r] = { ...SYMBOLS[7], isGold: false };
              transformedWilds++;
              if (el) {
                el.classList.remove('winning', 'gold');
                el.classList.add('wild', 'transforming-wild');
                el.innerHTML = `<div class="tile-icon">👑</div><div class="tile-name">WILD</div>`;
              }
            } else {
              gridMatrix[c][r] = null;
              if (el) el.classList.add('exploding');
            }
          });

          if (transformedWilds > 0) playSound('wild_transform');

          await new Promise(r => setTimeout(r, turboMode ? 220 : 400));

          // Jatuhkan simbol baru dengan pengisian terkontrol
          dropAndFillGridControlled(outcome);

          for (let c = 0; c < 5; c++) {
            for (let r = 0; r < reelRows[c]; r++) {
              renderCell(c, r);
            }
          }

          await new Promise(r => setTimeout(r, turboMode ? 180 : 300));
        } else {
          hasWins = false;
        }
      }

      // Cek apakah 3 Scatter terpicu
      const scatterCount = countScatters();
      if (scatterCount >= 3 && !isFreeSpinsMode) {
        playSound('win_cheer');
        isFreeSpinsMode = true;
        freeSpinsRemaining = 10 + (scatterCount - 3) * 2;
        document.getElementById('freeSpinsBanner').classList.add('active');
        document.getElementById('fsCount').innerText = freeSpinsRemaining;
        updateMultiplierDisplay();
        showCelebration("FREE SPINS!", `${freeSpinsRemaining} PUTARAN`);
      }

      // Payout akhir
      if (spinTotalWin > 0) {
        playerBalance += spinTotalWin;
        updateBalanceUI(spinTotalWin);
        playSound('win_cheer');

        if (spinTotalWin >= currentBet * 10) {
          showCelebration("SENSATIONAL WIN!", `Rp ${spinTotalWin.toLocaleString('id-ID')}`);
        } else if (spinTotalWin >= currentBet * 2) {
          showCelebration("BIG WIN!", `Rp ${spinTotalWin.toLocaleString('id-ID')}`);
        } else if (outcome === 'ldw') {
          showCelebration("WIN!", `Rp ${spinTotalWin.toLocaleString('id-ID')}`);
        }
      } else {
        updateBalanceUI(0);
      }

      if (isFreeSpinsMode && freeSpinsRemaining <= 0) {
        isFreeSpinsMode = false;
        document.getElementById('freeSpinsBanner').classList.remove('active');
        cascadeIndex = 0;
        updateMultiplierDisplay();
      }

      if (adminConn && adminConn.open) {
        adminConn.send({
          type: 'SPIN_COMPLETED',
          balance: playerBalance,
          win: spinTotalWin,
          outcome: outcome
        });
      }

      isSpinning = false;
      document.getElementById('spinButton').disabled = false;
    }

    async function animateRollingReels() {
      const duration = turboMode ? 220 : 600;
      const interval = 50;
      const steps = Math.floor(duration / interval);

      for (let s = 0; s < steps; s++) {
        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < reelRows[c]; r++) {
            const sym = SYMBOLS[Math.floor(Math.random() * 7)];
            const el = document.getElementById(`cell-${c}-${r}`);
            if (el) el.innerHTML = `<div class="tile-icon">${sym.icon}</div>`;
          }
        }
        playSound('tile_stop');
        await new Promise(r => setTimeout(r, interval));
      }
    }

    /* =========================================================
       LOGIKA GENERATOR POLA KETAT (100% PASTI KALAH / LDW / WIN)
       ========================================================= */

    // Helper untuk menjamin ZONK (100% KALAH):
    // Setiap reel diisi simbol yang SALING LEPAS (DISJOINT), sehingga MUSTAHIL menyambung 3 reel berturut-turut!
    function getGuaranteedZonkTile(c, r) {
      if (c === 0) {
        // Reel 1: Hanya Fa (0) dan Zhong (1)
        const s = (r % 2 === 0) ? SYMBOLS[0] : SYMBOLS[1];
        return { ...s, isGold: false };
      } else if (c === 1) {
        // Reel 2: Hanya Bai (2) dan 8 Dots (3) -> sama sekali TIDAK BISA nyambung ke Reel 1
        const s = (r % 2 === 0) ? SYMBOLS[2] : SYMBOLS[3];
        return { ...s, isGold: false };
      } else if (c === 2) {
        // Reel 3: Hanya 5 Bamboo (4) dan 5 Wan (5) -> sama sekali TIDAK BISA nyambung
        const s = (r % 2 === 0) ? SYMBOLS[4] : SYMBOLS[5];
        return { ...s, isGold: false };
      } else if (c === 3) {
        // Reel 4: 2 Dots (6) dan Bai (2)
        const s = (r % 2 === 0) ? SYMBOLS[6] : SYMBOLS[2];
        return { ...s, isGold: false };
      } else {
        // Reel 5: Fa (0) dan 5 Bamboo (4)
        const s = (r % 2 === 0) ? SYMBOLS[0] : SYMBOLS[4];
        return { ...s, isGold: false };
      }
    }

    function applyStrictGridOutcome(outcome) {
      if (outcome === 'zonk') {
        // 100% DIJAMIN KALAH TOTAL: Tidak ada Wild, tidak ada Scatter beruntun, tidak ada 3-match
        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < reelRows[c]; r++) {
            gridMatrix[c][r] = getGuaranteedZonkTile(c, r);
          }
        }
      } else if (outcome === 'near_miss') {
        // NEAR MISS: Tepat 2 Scatter (Reel 1 & Reel 2), Reel 3 meleset di baris ekstra
        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < reelRows[c]; r++) {
            gridMatrix[c][r] = getGuaranteedZonkTile(c, r);
          }
        }
        gridMatrix[0][1] = { ...SYMBOLS[8], isScatter: true, isGold: false };
        gridMatrix[1][2] = { ...SYMBOLS[8], isScatter: true, isGold: false };
        gridMatrix[2][0] = { ...SYMBOLS[8], isScatter: true, isGold: false }; // Baris paling atas, meleset!
      } else if (outcome === 'ldw') {
        // LOSS DISGUISED AS WIN: Sambungkan HANYA 1 kombinasi kecil (5 Wan, payout 2)
        // Di Reel 2 ubinnya emas -> jadi Wild untuk kaskade kedua (2 Dots, payout 1)
        // Total Payout = (1*2 * (bet/20) * 1) + (1*1 * (bet/20) * 2) = 0.1 bet + 0.1 bet = 0.2 bet (Rp 2.000 dari bet Rp 10.000)
        // RUGI BERSIH Rp 8.000, tapi bersuara dan beranimasi perayaan kaskade!
        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < reelRows[c]; r++) {
            gridMatrix[c][r] = getGuaranteedZonkTile(c, r);
          }
        }
        // Pasang 5 Wan di baris 1
        gridMatrix[0][1] = { ...SYMBOLS[5], isGold: false };
        gridMatrix[1][1] = { ...SYMBOLS[5], isGold: true }; // Emas!
        gridMatrix[2][1] = { ...SYMBOLS[5], isGold: false };
      } else if (outcome === 'big_win' || outcome === 'win_hook') {
        // 💰 MENANG BESAR (SENSATIONAL BIG WIN):
        // Sambungan ubin Naga Hijau (Fa) 5 Reel dengan 16 WAYS + Transformasi Wild Emas!
        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < reelRows[c]; r++) {
            gridMatrix[c][r] = getGuaranteedZonkTile(c, r);
          }
        }
        // Reel 0: 2 ubin Fa (baris 1, 2)
        gridMatrix[0][1] = { ...SYMBOLS[0], isGold: false };
        gridMatrix[0][2] = { ...SYMBOLS[0], isGold: false };

        // Reel 1: 2 ubin Fa (baris 1 biasa, baris 2 EMAS)
        gridMatrix[1][1] = { ...SYMBOLS[0], isGold: false };
        gridMatrix[1][2] = { ...SYMBOLS[0], isGold: true };

        // Reel 2: 2 ubin Fa (baris 1 biasa, baris 2 EMAS)
        gridMatrix[2][1] = { ...SYMBOLS[0], isGold: false };
        gridMatrix[2][2] = { ...SYMBOLS[0], isGold: true };

        // Reel 3: 2 ubin Fa (baris 1, 2)
        gridMatrix[3][1] = { ...SYMBOLS[0], isGold: false };
        gridMatrix[3][2] = { ...SYMBOLS[0], isGold: false };

        // Reel 4: 1 ubin Fa (baris 1)
        gridMatrix[4][1] = { ...SYMBOLS[0], isGold: false };
      } else if (outcome === 'scatter_bonus') {
        // 3 Scatter memicu 10 Free Spins
        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < reelRows[c]; r++) {
            gridMatrix[c][r] = getGuaranteedZonkTile(c, r);
          }
        }
        gridMatrix[0][1] = { ...SYMBOLS[8], isScatter: true, isGold: false };
        gridMatrix[1][2] = { ...SYMBOLS[8], isScatter: true, isGold: false };
        gridMatrix[2][2] = { ...SYMBOLS[8], isScatter: true, isGold: false };
      } else {
        // Default aman: Zonk
        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < reelRows[c]; r++) {
            gridMatrix[c][r] = getGuaranteedZonkTile(c, r);
          }
        }
      }
    }

    function dropAndFillGridControlled(outcome) {
      for (let c = 0; c < 5; c++) {
        const remaining = [];
        for (let r = 0; r < reelRows[c]; r++) {
          if (gridMatrix[c][r] !== null) remaining.push(gridMatrix[c][r]);
        }

        const missing = reelRows[c] - remaining.length;
        const newTiles = [];
        for (let i = 0; i < missing; i++) {
          if (outcome === 'big_win' && (c === 0 || c === 3)) {
            // Drop Zhong (Red Dragon) so Wilds connect for second cascade
            newTiles.push({ ...SYMBOLS[1], isGold: false });
          } else {
            newTiles.push(getGuaranteedZonkTile(c, i));
          }
        }

        gridMatrix[c] = [...newTiles, ...remaining];
      }
    }

    function evaluateWaysWin() {
      const winningWays = [];
      const winningCellsSet = new Set();
      let totalBasePayout = 0;

      for (let s = 0; s < 7; s++) {
        const targetSym = SYMBOLS[s];
        const matchColCells = [[], [], [], [], []];

        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < reelRows[c]; r++) {
            const cell = gridMatrix[c][r];
            if (!cell) continue;
            if (cell.id === targetSym.id || cell.isWild) {
              matchColCells[c].push([c, r]);
            }
          }
          if (matchColCells[c].length === 0) break;
        }

        let chainLen = 0;
        for (let c = 0; c < 5; c++) {
          if (matchColCells[c].length > 0) chainLen++;
          else break;
        }

        if (chainLen >= 3) {
          let ways = 1;
          for (let c = 0; c < chainLen; c++) {
            ways *= matchColCells[c].length;
            matchColCells[c].forEach(pos => winningCellsSet.add(`${pos[0]},${pos[1]}`));
          }
          const symPay = targetSym.pays[chainLen] || 0;
          totalBasePayout += ways * symPay;
          winningWays.push({ symbol: targetSym.name, chain: chainLen, ways, payout: ways * symPay });
        }
      }

      const winningCells = Array.from(winningCellsSet).map(str => str.split(',').map(Number));
      return { winningWays, winningCells, totalBasePayout };
    }

    function countScatters() {
      let count = 0;
      for (let c = 0; c < 5; c++) {
        for (let r = 0; r < reelRows[c]; r++) {
          if (gridMatrix[c][r] && gridMatrix[c][r].isScatter) count++;
        }
      }
      return count;
    }

    function updateBalanceUI(lastWin) {
      document.getElementById('playerBalanceDisplay').innerText = `Rp ${playerBalance.toLocaleString('id-ID')}`;
      document.getElementById('spinWinDisplay').innerText = `Rp ${lastWin.toLocaleString('id-ID')}`;
    }

    function showCelebration(title, amount) {
      document.getElementById('celebTitle').innerText = title;
      document.getElementById('celebAmount').innerText = amount;
      document.getElementById('celebrationOverlay').classList.add('show');
    }

    function closeCelebration() {
      document.getElementById('celebrationOverlay').classList.remove('show');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initReelsBoard();
      updateMultiplierDisplay();
      initConnection();
    });
  </script>
